[workspace]

[package]
name = "db-qa-upstash"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22"
data_bucket = { path = "../.." }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
